name: Build Debug APK

# Baut eine Debug-APK der SpotMe-Hülle (Capacitor).
# Start: Actions -> "Build Debug APK" -> Run workflow
# Die PWA selbst wird live von der Website geladen, ein Rebuild ist nur
# nötig, wenn sich android-app/ ändert.
on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Abhängigkeiten installieren
        working-directory: android-app
        run: npm install

      - name: Android-Projekt erzeugen
        working-directory: android-app
        run: |
          npx cap add android
          npx cap sync android

      - name: Berechtigungen einbauen (Standort, Benachrichtigungen)
        working-directory: android-app
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          for p in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION POST_NOTIFICATIONS; do
            sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$p\" />\n</manifest>#" "$MAN"
          done
          DIR=android/app/src/main/java/io/github/spotmecaching/app
          mkdir -p "$DIR"
          cat > "$DIR/MainActivity.java" <<'JAVA'
          package io.github.spotmecaching.app;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import java.util.ArrayList;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              String[] wanted = Build.VERSION.SDK_INT >= 33
                ? new String[] {
                    Manifest.permission.ACCESS_FINE_LOCATION,
                    Manifest.permission.ACCESS_COARSE_LOCATION,
                    Manifest.permission.POST_NOTIFICATIONS }
                : new String[] {
                    Manifest.permission.ACCESS_FINE_LOCATION,
                    Manifest.permission.ACCESS_COARSE_LOCATION };
              ArrayList<String> need = new ArrayList<>();
              for (String p : wanted) {
                if (ContextCompat.checkSelfPermission(this, p) != PackageManager.PERMISSION_GRANTED) {
                  need.add(p);
                }
              }
              if (!need.isEmpty()) {
                ActivityCompat.requestPermissions(this, need.toArray(new String[0]), 4711);
              }
            }
          }
          JAVA
          echo "--- Manifest-Berechtigungen:"
          grep "uses-permission" "$MAN"

      - name: Debug-APK bauen
        working-directory: android-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: spotme-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
