name: Build Debug APK

# Baut eine Debug-APK der SpotMe-Hülle (Capacitor).
# Start: Actions -> "Build Debug APK" -> Run workflow
# Die PWA selbst wird live von der Website geladen, ein Rebuild ist nur
# nötig, wenn sich android-app/ ändert.
on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Abhängigkeiten installieren
        working-directory: android-app
        run: npm install

      - name: Android-Projekt erzeugen
        working-directory: android-app
        run: |
          npx cap add android
          npx cap sync android

      - name: Debug-APK bauen
        working-directory: android-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: spotme-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
