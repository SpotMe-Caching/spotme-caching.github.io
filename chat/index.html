<!-- Profil / Einstellungen -->

      <div class="copy-row">
        <button onclick="exportBackup()">Sichern</button>
        <button onclick="document.getElementById('restoreFile').click()">Wiederherstellen</button>
        <input type="file" id="restoreFile" accept=".json,application/json" class="hidden" onchange="importBackup(this)">
      </div>
      <button class="link-btn" style="width:100%;text-align:center;color:#ff4f7b;" onclick="deleteEverything()">🗑 Alles von mir löschen</button>

<!-- Chat Detail -->
<div id="chatDetailScreen">
  <!-- Status Banner (vereint: früher Top-Banner + Footer) -->
  <div id="p2pBanner" class="p2p-banner server">
    <span class="icon">☁️</span> 
    <span id="p2pBannerText">Verbindung wird hergestellt...</span>

  <div class="chat-header">
    <div class="hd-avatar" id="headerAvatar">?</div>

      <div class="header-code" id="headerCode"></div>
      <div class="header-status" id="headerStatus">

          <span class="p2p-dot"></span>
          <span id="p2pStatusText">Offline</span>

  <div class="input-bar">

    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
// ── GLOBAL VARIABLES ───────────────────────────────────────────────────────
const API = 'https://spotme-chat-obom.onrender.com/api';

let CODE = null, TOKEN = null, PROFILE = null;
let CURRENT_ROOM = null, PARTNER_CODE = null, PARTNER_NAME = null;
let RENDERED_MSG_COUNT = 0; // FIX: für inkrementelles Rendern in renderMessages()
let POLL_TIMER = null;
const CHAT_PREFIX = 'sm_chat_msg_'; // eigener Speicher – getrennt vom Caching-Chat (sm_local_msg_)

// ══════════════════════════════════════════════════════════════════════════
// LOKALE VERSCHLÜSSELUNG (AES-GCM, Web Crypto API)
// Philosophie: Server ist nur 7-Tage-Zwischenspeicher, P2P ist per WebRTC
// (DTLS) verschlüsselt – aber localStorage lag bisher im Klartext auf dem
// Gerät. Das ist das lokale "Backup" (bleibt bis App/Speicher gelöscht wird),
// also muss es genauso codiert sein wie der Rest der Kette.
// Schlüssel wird aus CODE+TOKEN abgeleitet (PBKDF2) – nie gespeichert,
// nur pro Session im Speicher gehalten.
// ══════════════════════════════════════════════════════════════════════════
let _localCryptoKey = null;

async function getLocalCryptoKey() {
  if (_localCryptoKey) return _localCryptoKey;
  if (!CODE || !TOKEN) {
    throw new Error('Kein CODE/TOKEN vorhanden – Verschlüsselung nicht möglich');
  }
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    'raw',
    enc.encode(CODE + ':' + TOKEN),
    'PBKDF2',
    false,
    ['deriveKey']
  );
  _localCryptoKey = await crypto.subtle.deriveKey(
    {
      name: 'PBKDF2',
      salt: enc.encode('spotme-chat-local-v1'),
      iterations: 100000,
      hash: 'SHA-256'
    },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
  return _localCryptoKey;
}

// Beim Logout: Schlüssel aus dem Speicher werfen
function clearLocalCryptoKey() {
  _localCryptoKey = null;
}

async function encryptLocalData(obj) {
  const key = await getLocalCryptoKey();
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const data = enc.encode(JSON.stringify(obj));
  const cipherBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, data);
  const combined = new Uint8Array(iv.length + cipherBuf.byteLength);
  combined.set(iv, 0);
  combined.set(new Uint8Array(cipherBuf), iv.length);
  let binary = '';
  combined.forEach(b => binary += String.fromCharCode(b));
  return 'enc1:' + btoa(binary); // Prefix markiert Format-Version
}

async function decryptLocalData(stored) {
  if (typeof stored !== 'string' || !stored.startsWith('enc1:')) {
    // Altes Klartext-Format (vor Verschlüsselungs-Update) → Migration
    return JSON.parse(stored);
  }
  const key = await getLocalCryptoKey();
  const binary = atob(stored.slice(5));
  const combined = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) combined[i] = binary.charCodeAt(i);
  const iv = combined.slice(0, 12);
  const data = combined.slice(12);
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

// Wrapper: Nachrichten eines Rooms laden/speichern (ersetzt direkte
// localStorage.getItem/setItem-Aufrufe für Chat-Nachrichten)
async function loadRoomMessages(room) {
  const raw = localStorage.getItem(CHAT_PREFIX + room);
  if (!raw) return [];
  try {
    const msgs = await decryptLocalData(raw);
    return Array.isArray(msgs) ? msgs : [];
  } catch (e) {
    console.error('[Crypto] Entschlüsselung fehlgeschlagen für', room, e);
    return [];
  }
}

async function saveRoomMessages(room, msgs) {
  try {
    const enc = await encryptLocalData(msgs);
    localStorage.setItem(CHAT_PREFIX + room, enc);
  } catch (e) {
    console.error('[Crypto] Verschlüsselung fehlgeschlagen für', room, e);
  }
}

// WebRTC / P2P Status
let webrtc = null;
let isP2PConnected = false;
let p2pConnectionTime = null;

// ── PROFIL (automatisch, nur Name) ─────────────────────────────────────────
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function fmtId(c) { c = String(c || ''); return c.length === 6 ? c.slice(0, 3) + '-' + c.slice(3) : c; }
function normId(v) { return String(v || '').toLowerCase().replace(/[^a-z]/g, ''); }
function tfetch(url, opts, ms) {
  const ctl = new AbortController();
  const tm = setTimeout(() => ctl.abort(), ms || 10000);
  return fetch(url, Object.assign({}, opts || {}, { signal: ctl.signal })).finally(() => clearTimeout(tm));
}
function getSeen() { try { return JSON.parse(lsGet('sm_chat_seen') || '{}') || {}; } catch (e) { return {}; } }
function markSeen(room) {
  if (!room) return;
  const m = getSeen(); m[room] = Date.now();
  lsSet('sm_chat_seen', JSON.stringify(m));
}
function getContacts() { try { return JSON.parse(lsGet('sm_chat_contacts') || '{}') || {}; } catch (e) { return {}; } }
function addContact(code, name) {
  if (!code) return;
  const c = getContacts();
  if (c[code] === (name || c[code] || code)) return;
  c[code] = name || c[code] || code;
  lsSet('sm_chat_contacts', JSON.stringify(c));
}

function showSetup(prefill, msg) {
  document.getElementById('chatListScreen').style.display = 'none';
  document.getElementById('chatDetailScreen').style.display = 'none';
  document.getElementById('loginScreen').classList.remove('hidden');
  const n = document.getElementById('registerName');
  if (prefill) n.value = prefill;
  document.getElementById('registerError').textContent = msg || '';
}

async function createProfile() {
  const name = document.getElementById('registerName').value.trim();
  const errEl = document.getElementById('registerError');
  const btn = document.getElementById('setupBtn');
  errEl.textContent = '';
  if (!name) { errEl.textContent = 'Bitte einen Namen eingeben'; return; }
  btn.disabled = true;
  try {
    const res = await tfetch(`${API}/messenger/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    }, 20000);
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || 'Anlegen fehlgeschlagen');
    }
    const { code, token, name: n } = await res.json();
    CODE = code; TOKEN = token; PROFILE = { code, name: n };
    lsSet('sm_chat_code', code);
    lsSet('sm_chat_token', token);
    lsSet('sm_chat_profile', JSON.stringify(PROFILE));
    startApp();
  } catch (e) {
    errEl.textContent = (e && e.name === 'AbortError') ? 'Keine Verbindung – bitte erneut versuchen' : (e.message || 'Anlegen fehlgeschlagen');
  } finally { btn.disabled = false; }
}

function startApp() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('chatListScreen').style.display = 'block';
  try { initWebRTC(); } catch (e) { console.warn('[P2P]', e); }
  initPolling();
  initPushNotifications();
  renderChatList();
  pingVisit();
  const add = new URLSearchParams(location.search).get('add');
  if (add) {
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    showNewChatLayer();
    document.getElementById('newChatCode').value = fmtId(normId(add));
  }
}

// Besuch melden – hält das Profil am Leben (Aufräumen nach 30 Tagen ohne Besuch)
let LAST_VISIT_PING = 0;
function pingVisit() {
  if (!CODE || !TOKEN || Date.now() - LAST_VISIT_PING < 6 * 3600 * 1000) return;
  LAST_VISIT_PING = Date.now();
  tfetch(`${API}/profile/visit`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: CODE, token: TOKEN })
  }).catch(() => { LAST_VISIT_PING = 0; });
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) pingVisit(); });

// Start: gespeichertes Profil sofort nutzen (auch offline), Server prüft im Hintergrund
async function autoLogin() {
  const savedCode = lsGet('sm_chat_code');
  const savedToken = lsGet('sm_chat_token');
  if (!savedCode || !savedToken) { showSetup(); return false; }
  CODE = savedCode; TOKEN = savedToken;
  try { PROFILE = JSON.parse(lsGet('sm_chat_profile') || 'null'); } catch (e) { PROFILE = null; }
  if (!PROFILE || !PROFILE.name) PROFILE = { code: CODE, name: CODE };
  startApp();
  verifyProfile();
  return true;
}

async function verifyProfile() {
  try {
    const res = await tfetch(`${API}/auth/verify`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: CODE, token: TOKEN })
    });
    if (res.status === 403) return profileLost();
    if (res.ok) {
      const p = await res.json();
      if (p && p.name) { PROFILE = { code: CODE, name: p.name }; lsSet('sm_chat_profile', JSON.stringify(PROFILE)); }
    }
  } catch (e) { /* offline – egal */ }
}

// Profil gibt es auf dem Server nicht mehr (z. B. 30 Tage ohne Besuch) → neu anlegen lassen
function profileLost() {
  const oldName = PROFILE && PROFILE.name;
  stopRuntime();
  wipeLocal();
  showSetup(oldName, 'Dein altes Profil ist abgelaufen. Lege es kurz neu an – du bekommst eine neue ID.');
}

function stopRuntime() {
  if (webrtc) { try { webrtc.destroy(); } catch (e) {} webrtc = null; }
  isP2PConnected = false; p2pConnectionTime = null;
  if (POLL_TIMER) clearInterval(POLL_TIMER);
  POLL_TIMER = null;
}

function wipeLocal() {
  try {
    Object.keys(localStorage).filter(k => k.startsWith('sm_chat_')).forEach(k => localStorage.removeItem(k));
  } catch (e) {}
  CODE = null; TOKEN = null; PROFILE = null;
  CURRENT_ROOM = null; PARTNER_CODE = null; PARTNER_NAME = null;
  clearLocalCryptoKey();
}

// ── PROFIL-EINSTELLUNGEN ──────────────────────────────────────────────────
async function showVersion() {
  const el = document.getElementById('chatVer');
  try {
    const keys = await caches.keys();
    const k = keys.filter(x => /^spot-static-chat-v/.test(x)).sort().pop();
    el.textContent = k ? k.replace('spot-static-chat-v', '') : 'unbekannt';
  } catch (e) { el.textContent = 'unbekannt'; }
}
function showSettings() {
  showVersion();
  document.getElementById('setId').value = fmtId(CODE);
  document.getElementById('setName').value = (PROFILE && PROFILE.name) || '';
  document.getElementById('setMsg').textContent = '';
  document.getElementById('settingsLayer').classList.remove('hidden');
}
function hideSettings() { document.getElementById('settingsLayer').classList.add('hidden'); }
function setMsg(t) { const el = document.getElementById('setMsg'); el.textContent = t; setTimeout(() => { if (el.textContent === t) el.textContent = ''; }, 3000); }

async function copyId() {
  const el = document.getElementById('setId');
  try { await navigator.clipboard.writeText(el.value); } catch (e) { el.select(); try { document.execCommand('copy'); } catch (e2) {} }
  setMsg('✅ Kopiert');
}
async function shareId() {
  const url = `${location.origin}/chat/?add=${CODE}`;
  const text = `Schreib mir im Spot-Chat – meine ID: ${fmtId(CODE)}`;
  try {
    if (navigator.share) { await navigator.share({ title: 'Spot-Chat', text, url }); return; }
    await navigator.clipboard.writeText(`${text}\n${url}`);
    setMsg('✅ Link kopiert');
  } catch (e) {}
}

async function saveName() {
  const name = document.getElementById('setName').value.trim();
  if (!name) return setMsg('Bitte einen Namen eingeben');
  try {
    const res = await tfetch(`${API}/messenger/rename`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: CODE, token: TOKEN, name })
    });
    if (!res.ok) throw new Error();
    PROFILE = { code: CODE, name };
    lsSet('sm_chat_profile', JSON.stringify(PROFILE));
    setMsg('✅ Name gespeichert');
  } catch (e) { setMsg('Keine Verbindung – bitte später erneut versuchen'); }
}

function exportBackup() {
  const data = { app: 'spot-chat', v: 1, items: {} };
  Object.keys(localStorage).filter(k => k.startsWith('sm_chat_')).forEach(k => { data.items[k] = localStorage.getItem(k); });
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `spot-chat-sicherung-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  setMsg('✅ Sicherung erstellt – sicher aufbewahren, sie enthält deinen Zugang');
}

async function importBackup(input) {
  const f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const items = data && data.app === 'spot-chat' && data.items;
    if (!items || !items.sm_chat_code || !items.sm_chat_token) throw new Error();
    if (!confirm('Aktuelles Profil auf diesem Gerät durch die Sicherung ersetzen?')) return;
    stopRuntime(); wipeLocal();
    Object.keys(items).forEach(k => { if (k.startsWith('sm_chat_')) lsSet(k, String(items[k])); });
    location.reload();
  } catch (e) { setMsg('Datei nicht lesbar'); }
}

async function deleteEverything() {
  if (!confirm('Wirklich ALLES löschen? Profil, ID, Chats auf diesem Gerät und alle Daten auf dem Server. Das geht nicht rückgängig.')) return;
  try {
    const res = await tfetch(`${API}/account/${CODE}`, {
      method: 'DELETE', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN })
    });
    if (!res.ok && res.status !== 403) throw new Error();
  } catch (e) { return setMsg('Keine Verbindung – Server-Daten konnten nicht gelöscht werden. Bitte später erneut.'); }
  stopRuntime(); wipeLocal();
  hideSettings();
  try { const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r => r.unregister())); } catch (e) {}
  location.reload();
}

// ── WEB PUSH SETUP ────────────────────────────────────────────────────────
// Fehlte bisher komplett im Chat-Frontend (Auskopplung vom Root-Chat).
// WICHTIG: subscribe() läuft über die /chat/sw.js Registrierung –
// eine alte Subscription der Root-App wirkt hier NICHT, weil
// Push-Events immer an die SW-Registrierung gehen, die subscribed hat.
async function initPushNotifications() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    console.warn('[Push] Nicht unterstützt in diesem Browser');
    return;
  }
  if (!CODE) return;

  try {
    const reg = await navigator.serviceWorker.ready; // wartet auf /chat/sw.js

    // Bereits subscribed? Dann nur sicherstellen, dass Server sie kennt.
    let sub = await reg.pushManager.getSubscription();

    if (!sub) {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') {
        console.warn('[Push] Berechtigung verweigert');
        return;
      }

      const keyRes = await fetch(`${API}/push/vapid-public-key`);
      const { publicKey } = await keyRes.json();
      if (!publicKey) {
        console.warn('[Push] Kein VAPID Public Key vom Server');
        return;
      }

      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(publicKey)
      });
    }

    // Subscription beim Server hinterlegen (idempotent, überschreibt alte)
    await fetch(`${API}/push/subscribe`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: CODE, token: TOKEN, subscription: sub })
    });

    console.log('[Push] Subscription aktiv für', CODE);
  } catch (err) {
    console.error('[Push] Setup fehlgeschlagen:', err);
  }
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

// ── WEBRTC / P2P SETUP ────────────────────────────────────────────────────
async function initWebRTC() {
  console.log('[WebRTC] initWebRTC called');

  if (!window.Peer) {
    console.error('[WebRTC] PeerJS not loaded!');
    return;
  }
  if (!window.SpotMeWebRTC) {
    console.error('[WebRTC] SpotMeWebRTC class not found!');
    return;
  }

  console.log('[WebRTC] Instantiated with User:', PROFILE?.name || CODE);

  webrtc = new window.SpotMeWebRTC(CODE, TOKEN, PROFILE?.name || CODE);

  // ── NEU: Peer ist beim Server registriert ──
  webrtc.onPeerReady = (id) => {
    console.log('[Chat] Peer registriert beim Server, ID:', id);
  };

  // ── P2P Datenkanal geöffnet ──
  webrtc.onConnect = (peerId) => {
    console.log('[Chat] P2P Verbindung hergestellt mit:', peerId);
    isP2PConnected = true;
    p2pConnectionTime = new Date();
    updateP2PUI(true, 'P2P Aktiv');
  };

  // ── Nachricht via P2P empfangen ──
  webrtc.onMessage = async (msg) => {
    console.log('[Chat] P2P Nachricht empfangen:', msg);

    // WICHTIG: Room aus Absender-Code berechnen, nicht CURRENT_ROOM nutzen
    // (Nachricht kann ankommen, wenn Chat gar nicht geöffnet ist)
    const room = [CODE, msg.from].sort().join('-');
    if (msg.fromName) addContact(msg.from, msg.fromName);

    const msgs = await loadRoomMessages(room);

    // Duplikat-Check
    const exists = msgs.some(e =>
      e.from === msg.from &&
      e.text === msg.text &&
      Math.abs((e.ts || 0) - (msg.ts || 0)) < 5000
    );

    if (!exists) {
      msgs.push({
        from: msg.from,
        fromName: msg.fromName,
        text: msg.text,
        ts: msg.ts || Date.now()
      });
      await saveRoomMessages(room, msgs);
    }

    // UI aktualisieren
    if (room === CURRENT_ROOM) {
      markSeen(room);
      renderMessages(true);
    }
    renderChatList();
  };

  // ── Zustellbestätigung (P2P) ── NUR "zugestellt", NIE "gelesen"/Uhrzeit
  webrtc.onAck = async (peerCode, ackTs) => {
    const room = [CODE, peerCode].sort().join('-');
    const msgs = await loadRoomMessages(room);
    const msg = msgs.find(m => m.from === CODE && m.ts === ackTs);
    if (msg && msg.status !== 'delivered') {
      msg.status = 'delivered';
      await saveRoomMessages(room, msgs);
      if (room === CURRENT_ROOM) {
        await renderMessages(); // Status-Änderung an bestehender Bubble → Full-Render
      }
    }
  };

  // ── P2P Verbindung getrennt ──
  webrtc.onDisconnect = (peerId) => {
    console.log('[Chat] P2P Verbindung getrennt:', peerId);
    isP2PConnected = false;
    p2pConnectionTime = null;
    updateP2PUI(false, 'Verbindung getrennt');
  };

  // ── Fehler ──
  webrtc.onError = (err) => {
    console.error('[Chat] WebRTC Error:', err);
    // peer-unavailable ist nicht kritisch — Partner vielleicht noch nicht online
    if (err.type === 'peer-unavailable') {
      updateP2PUI(false, 'Partner nicht online');
      return;
    }
    updateP2PUI(false, 'Fehler: ' + (err.type || 'unknown'));
  };

  // ── NEU: Peer SOFORT beim Login registrieren ──
  await webrtc.register();
}

// ── NEUER CHAT (Partner per Code hinzufügen) ──────────────────────────────
function showNewChatLayer() {
  document.getElementById('newChatCode').value = '';
  document.getElementById('newChatError').textContent = '';
  document.getElementById('newChatLayer').classList.remove('hidden');
  document.getElementById('newChatCode').focus();
}

function hideNewChatLayer() {
  document.getElementById('newChatLayer').classList.add('hidden');
}

async function startNewChat() {
  const partnerCode = normId(document.getElementById('newChatCode').value);
  const errEl = document.getElementById('newChatError');
  errEl.textContent = '';

  if (!/^[a-z]{6}$/.test(partnerCode)) {
    errEl.textContent = 'Bitte eine ID wie abc-def eingeben';
    return;
  }
  if (partnerCode === CODE) {
    errEl.textContent = 'Das ist deine eigene ID';
    return;
  }

  try {
    // Öffentlicher Profil-Check – existiert der Code überhaupt?
    const res = await tfetch(`${API}/profile/${partnerCode}?spot=messenger`);
    if (!res.ok) {
      errEl.textContent = res.status === 404 ? 'Keine Person mit dieser ID gefunden' : 'Server gerade nicht erreichbar';
      return;
    }
    const profile = await res.json();
    const partnerName = profile.name || partnerCode;

    hideNewChatLayer();
    addContact(partnerCode, partnerName);

    const room = [CODE, partnerCode].sort().join('-');
    await openChat(room, partnerCode, partnerName);
  } catch (e) {
    console.error('[NewChat]', e);
    errEl.textContent = 'Keine Verbindung – ID konnte nicht geprüft werden';
  }
}

// ── CHAT LIST ─────────────────────────────────────────────────────────────
async function renderChatList() {
  const container = document.getElementById('chatList');
  if (!CODE) {
    container.innerHTML = '<p class="text-center" style="padding:2rem;color:var(--muted2);">Keine Chats</p>';
    return;
  }
  const contacts = getContacts();
  const seen = getSeen();
  const byRoom = {};
  for (const [code, name] of Object.entries(contacts)) {
    byRoom[[CODE, code].sort().join('-')] = { partnerCode: code, partnerName: name, lastText: 'Noch keine Nachricht', lastTs: 0, timeStr: '', unread: 0 };
  }
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key || !key.startsWith(CHAT_PREFIX)) continue;
    const room = key.slice(CHAT_PREFIX.length);
    const codes = room.split('-');
    if (!codes.includes(CODE)) continue;
    const partnerCode = codes.find(c => c !== CODE);
    if (!partnerCode) continue;
    let msgs = [];
    try { msgs = await decryptLocalData(localStorage.getItem(key)); } catch (e) { msgs = []; }
    if (!Array.isArray(msgs) || !msgs.length) continue;
    const last = msgs[msgs.length - 1];
    const prev = last.text.length > 30 ? last.text.slice(0, 30) + '…' : last.text;
    const other = [...msgs].reverse().find(m => m.from !== CODE);
    byRoom[room] = {
      partnerCode,
      partnerName: contacts[partnerCode] || (other && other.fromName) || fmtId(partnerCode),
      lastText: prev, lastTs: last.ts,
      unread: msgs.filter(m => m.from !== CODE && (m.ts || 0) > (seen[room] || 0)).length,
      timeStr: new Date(last.ts).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })
    };
  }
  const chats = Object.entries(byRoom).map(([room, c]) => Object.assign({ room }, c)).sort((a, b) => b.lastTs - a.lastTs);
  container.innerHTML = chats.map(c => `
    <div class="chat-item" data-room="${escapeHtml(c.room)}" data-code="${escapeHtml(c.partnerCode)}" data-name="${escapeHtml(c.partnerName)}">
      <div class="avatar">${escapeHtml((c.partnerName[0] || '?').toUpperCase())}</div>
      <div class="chat-info">
        <div class="chat-name">${escapeHtml(c.partnerName)}</div>
        <div class="chat-preview">${escapeHtml(c.lastText)}</div>
      </div>
      <div class="chat-meta"><div class="chat-time">${c.timeStr}</div>${c.unread ? `<div class="unread-badge">${c.unread}</div>` : ''}</div>
      <button class="chat-del" data-del="${escapeHtml(c.room)}" aria-label="Chat löschen" title="Chat löschen">🗑</button>
    </div>`).join('') || `<p class="text-center" style="padding:2rem;color:var(--muted2);">Noch keine Chats.<br>Tippe auf + und gib eine ID ein.<br><br>Deine ID: <b>${fmtId(CODE)}</b></p>`;
}
// Chat löschen (Nachrichten auf diesem Gerät + Kontakt)
function deleteChat(room, name) {
  if (!confirm(`Chat mit ${name || 'diesem Kontakt'} löschen? Alle Nachrichten auf diesem Gerät werden entfernt.`)) return;
  const partner = room.split('-').find(c => c !== CODE);
  lsDel(CHAT_PREFIX + room);
  const c = getContacts(); delete c[partner]; lsSet('sm_chat_contacts', JSON.stringify(c));
  const sn = getSeen(); delete sn[room]; lsSet('sm_chat_seen', JSON.stringify(sn));
  renderChatList();
}
document.addEventListener('click', (e) => {
  const del = e.target.closest && e.target.closest('.chat-del');
  if (del) {
    e.stopPropagation();
    const it = del.closest('.chat-item');
    deleteChat(del.dataset.del, it && it.dataset.name);
    return;
  }
  const it = e.target.closest && e.target.closest('.chat-item');
  if (it && it.dataset.room) openChat(it.dataset.room, it.dataset.code, it.dataset.name);
});

// ── OPEN CHAT & P2P CONNECTION ────────────────────────────────────────────
async function openChat(room, partnerCode, partnerName) {
  CURRENT_ROOM = room;
  PARTNER_CODE = partnerCode;
  PARTNER_NAME = partnerName;
  markSeen(room);

  document.getElementById('chatListScreen').style.display = 'none';
  document.getElementById('chatDetailScreen').style.display = 'flex';
  fitChatToViewport();

  document.getElementById('headerName').textContent = partnerName;
  document.getElementById('headerCode').textContent = fmtId(partnerCode);
  document.getElementById('headerAvatar').textContent = (partnerName[0] || '?').toUpperCase();
  updateP2PUI(false, 'Verbinde...');

  await renderMessages();

  // Versuch P2P Verbindung herzustellen
  await attemptP2PConnection(partnerCode);
}

async function attemptP2PConnection(partnerCode) {
  // Safety Checks
  if (!webrtc) {
    console.warn('[Chat] WebRTC nicht initialisiert');
    updateP2PUI(false, 'Fehler: WebRTC missing');
    return;
  }

  if (!CODE || !PARTNER_CODE) {
    console.error('[Chat] Missing CODE or PARTNER_CODE:', { CODE, PARTNER_CODE });
    updateP2PUI(false, 'Fehler: Invalid State');
    return;
  }

  try {
    console.log('[Chat] Starte P2P-Verbindung zu:', partnerCode);

    // 1. Bereit-Invite an Partner senden (Signal über Server)
    await sendReadinessInvite(PARTNER_CODE);
    console.log('[Chat] Invite gesendet');

    // 2. Auf eigene Peer-Bereitschaft warten (falls noch nicht registriert)
    await webrtc.connect(PARTNER_CODE, (peerId) => {
      console.log('[Chat] Eigener Peer bereit:', peerId);
    });

    // 3. Verbindung zum Partner initiieren
    // Partner muss ebenfalls registriert sein (Login → register())
    // FIX: Nur die Seite mit dem "kleineren" Code initiiert aktiv.
    // Öffnen beide Seiten den Chat gleichzeitig, entstehen sonst zwei
    // parallele Connections und this.conn wird inkonsistent überschrieben —
    // das war der Grund für "Nachricht kommt erst beim Verlassen des Chats".
    if (CODE < PARTNER_CODE) {
      webrtc.initiateConnection(PARTNER_CODE);
      console.log('[Chat] Verbindung initiert (wir sind Initiator)');
    } else {
      console.log('[Chat] Warte auf eingehende Verbindung von', PARTNER_CODE);
    }

    // Timeout: Nach 3 Sek kein P2P → Server-Modus anzeigen
    setTimeout(() => {
      if (!isP2PConnected) {
        console.log('[Chat] P2P Timeout, bleibe im Server-Modus');
        updateP2PUI(false, 'Server-Modus (Timeout)');
      }
    }, 3000);

  } catch (err) {
    console.error('[Chat] P2P Verbindung fehlgeschlagen:', err);
    updateP2PUI(false, 'Server-Modus');

    // Bei peer-unavailable: Partner vielleicht noch nicht eingeloggt
    // Das ist OK — wir fallen in den Server-Modus (Polling)
    if (err.type === 'peer-unavailable') {
      console.log('[Chat] Partner noch nicht online — Server-Modus aktiv');
    }
  }
        }

async function sendReadinessInvite(partnerCode) {
  try {
    const res = await fetch(`${API}/invites/send`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        from: CODE,
        to: partnerCode,
        // Zeitfenster für dieses Treffen
        time_start: Date.now(),
        time_end: Date.now() + 2 * 60 * 60 * 1000  // 2 Stunden
      })
    });
    
    if (!res.ok) throw new Error('Invite fehlgeschlagen');
    console.log('[Chat] Bereit-Invite gesendet');
  } catch (err) {
    console.error('[Chat] Invite Error:', err);
    // Nicht fatal - P2P funktioniert trotzdem manchmal ohne Invite
  }
}

function goBackToList() {
  markSeen(CURRENT_ROOM);
  CURRENT_ROOM = null;
  PARTNER_CODE = null;
  PARTNER_NAME = null;
  
  // P2P Connection nicht schließen, sondern im Hintergrund halten
  // Optional: webrtc.cleanup(); wenn du Connection pro Chat schliessen willst
  
  document.getElementById('chatDetailScreen').style.display = 'none';
  document.getElementById('chatListScreen').style.display = 'block';
  renderChatList();
}

// ── MESSAGES ──────────────────────────────────────────────────────────────
async function getMessages() {
  if (!CURRENT_ROOM) return [];
  return await loadRoomMessages(CURRENT_ROOM);
}

async function saveMessages(msgs) {
  if (!CURRENT_ROOM) return;
  await saveRoomMessages(CURRENT_ROOM, msgs);
}

async function renderMessages(appendOnly = false) {
  const container = document.getElementById('messages');
  const msgs = await getMessages();

  const renderMsg = (m) => {
    const isMine = m.from === CODE;
    // Nur "gesendet" (✓) vs. "zugestellt" (✓✓) – bewusst KEIN Lesestatus
    // und KEINE zusätzliche Uhrzeit dafür (würde Online-Zeiten verraten).
    const statusTick = isMine
      ? (m.status === 'delivered'
          ? '<span class="msg-status delivered" title="Zugestellt">✓✓</span>'
          : '<span class="msg-status sent" title="Gesendet">✓</span>')
      : '';
    const time = new Date(m.ts).toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'});
    return `<div class="message ${isMine ? 'mine' : 'other'}">${escapeHtml(m.text)}<div class="msg-time">${time}${statusTick}</div></div>`;
  };

  // FIX: Bei jeder eingehenden Nachricht wurde vorher die komplette Liste
  // neu gebaut (innerHTML = alles) → Reflow/Ruckeln bei langen Chats.
  // Jetzt: nur neue Nachrichten anhängen, wenn wir schon im selben Room sind.
  if (appendOnly && container.dataset.room === CURRENT_ROOM && msgs.length > RENDERED_MSG_COUNT) {
    const neue = msgs.slice(RENDERED_MSG_COUNT);
    container.insertAdjacentHTML('beforeend', neue.map(renderMsg).join(''));
  } else {
    container.innerHTML = msgs.map(renderMsg).join('');
    container.dataset.room = CURRENT_ROOM;
  }

  RENDERED_MSG_COUNT = msgs.length;
  container.scrollTop = container.scrollHeight;
}

// ── SEND MESSAGE (P2P Priority + Fallback) ────────────────────────────────
// ── EINGABE: mehrzeilig, Auto-Grow, Strg/Cmd+Enter zum Senden ─────────────
// Return/Enter macht jetzt einen Zeilenumbruch (Standard-Textarea-Verhalten).
// Zum Senden: Button ➤ oder Strg+Enter / Cmd+Enter für Desktop-Tester.
(function setupMsgInput() {
  const input = document.getElementById('msgInput');
  if (!input) return;

  const autoGrow = () => {
    input.style.height = 'auto';
    input.style.height = input.scrollHeight + 'px';
  };

  input.addEventListener('input', autoGrow);

  input.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
      event.preventDefault();
      sendMessage();
    }
    // Normales Enter/Shift+Enter → Standardverhalten der Textarea (neue Zeile)
  });
})();

async function sendMessage() {
  const input = document.getElementById('msgInput');
  // FIX: Mehrfaches Enter erzeugt sonst viele Leerzeilen → riesige Bubble.
  // Maximal eine Leerzeile zwischen Absätzen bleibt erlaubt.
  const text = input.value.trim().replace(/\n{3,}/g, '\n\n');

  if (!text) return;

  if (!PARTNER_CODE) {
    console.error('[Chat] Kein Partner ausgewählt!');
    return;
  }

  const myName = PROFILE?.name || CODE;
  const ts = Date.now(); // EIN Timestamp für lokale Bubble + P2P-Ack-Matching

  // Lokal sofort speichern (UX: sofort sichtbar)
  const msgs = await getMessages();
  const msgObj = { from: CODE, fromName: myName, text, ts, status: 'sent' };
  msgs.push(msgObj);
  await saveMessages(msgs);
  await renderMessages(true);
  input.value = '';
  input.style.height = 'auto';

  // Priority: P2P → Server Fallback
  if (webrtc && typeof webrtc.isConnected === 'function' && webrtc.isConnected()) {
    try {
      const sent = webrtc.send(text, ts);
      if (sent) {
        console.log('[Chat] Via P2P gesendet');
        updateP2PUI(true, 'P2P Aktiv');
        return; // Ack kommt asynchron über webrtc.onAck rein
      }
    } catch (err) {
      console.error('[Chat] P2P Send Error, fällt auf Server zurück:', err);
    }
  }

  // Fallback zum Server
  try {
    const res = await fetch(`${API}/message`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        recipient: PARTNER_CODE,
        sender_code: CODE,
        sender_name: myName,
        message: text,
        spot_type: 'messenger_chat',
        token: TOKEN
        })
    });

    if (!res.ok) {
      console.warn('[Chat] Nachricht nicht gesendet:', res.status, res.statusText);
    } else {
      console.log('[Chat] Via Server gesendet');
      updateP2PUI(false, 'Server-Modus');

      // "delivered" = Push-Zustellung an den Dienst hat geklappt.
      // KEIN Lesestatus, keine Uhrzeit – nur ob die Benachrichtigung raus ist.
      const data = await res.json().catch(() => ({}));
      if (data.delivered) {
        const current = await getMessages();
        const stored = current.find(m => m.from === CODE && m.ts === ts);
        if (stored) {
          stored.status = 'delivered';
          await saveMessages(current);
          if (CURRENT_ROOM) await renderMessages();
        }
      }
    }
  } catch (e) {
    console.error('[Chat] Netzwerkfehler beim Senden:', e);
  }
 }

// ── HEADER STATUS UPDATE ──────────────────────────────────────────────────
function updateHeaderStatus(status, isP2P) {
  const el = document.getElementById('headerStatus');
  const indicator = document.getElementById('p2pIndicator');
  
  el.innerHTML = `<span class="p2p-indicator ${isP2P ? 'active' : 'inactive'}"></span>${status}`;
  
  isP2PConnected = isP2P;
}

// ── POLLING ───────────────────────────────────────────────────────────────
let POLLING = false;
async function initPolling() {
  if (POLL_TIMER) clearInterval(POLL_TIMER);
  POLL_TIMER = setInterval(pollOnce, 5000); // alle 5 Sekunden
  pollOnce();                                // und sofort beim Start
}
// sofort neu abholen, sobald die App wieder sichtbar ist oder Netz zurückkehrt
document.addEventListener('visibilitychange', () => { if (!document.hidden) pollOnce(); });
window.addEventListener('online', () => pollOnce());
window.addEventListener('focus', () => pollOnce());

async function pollOnce() {
    if (!CODE || POLLING) return;
    POLLING = true;

    try {
      // ── 1. Nachrichten abholen (wie bisher) ──
      const res = await tfetch(`${API}/messages/${CODE}?spot_type=messenger_chat&token=${encodeURIComponent(TOKEN)}`);
      if (res.ok) {
        const newMsgs = await res.json();
        if (newMsgs.length) {
          let renderedAny = false;
          let listNeedsUpdate = false;

          for (const m of newMsgs) {
            const room = [CODE, m.sender_code].sort().join('-');

            const msgs = await loadRoomMessages(room);

            const exists = msgs.some(e => e.sid === m.id) || msgs.some(e =>
              !e.sid && e.from === m.sender_code && e.text === m.message
            );
            if (m.sender_name) addContact(m.sender_code, m.sender_name);

            if (!exists) {
              msgs.push({
                from: m.sender_code,
                fromName: m.sender_name,
                text: m.message,
                sid: m.id,
                ts: new Date(m.created_at).getTime()
              });
              await saveRoomMessages(room, msgs);
              listNeedsUpdate = true;

              if (room === CURRENT_ROOM) {
                markSeen(room);
                await renderMessages(true);
                renderedAny = true;
              }
            }
          }

          // Empfang bestätigen – erst dann löscht der Server die Nachrichten
          fetch(`${API}/messages/${CODE}/ack`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: TOKEN, ids: newMsgs.map(x => x.id) })
          }).catch(() => {});
          if (renderedAny) {
            updateP2PUI(false, 'Server-Modus (Polling)');
          }
          if (listNeedsUpdate && !renderedAny) {
            renderChatList();
          }
        }
      }

      // ── 2. NEU: Invites abholen ──
      // Wenn jemand uns chatten will, stellen wir sicher dass unser Peer ready ist
      const invRes = await fetch(`${API}/invites/pending/${CODE}`);
      if (invRes.ok) {
        const invites = await invRes.json();
        if (invites && invites.length > 0) {
          invites.forEach(inv => {
            console.log('[Chat] Pending Invite von:', inv.from || inv.sender_code);

            // Unser Peer sollte bereits registriert sein (Login)
            // Nur sicherstellen, falls etwas schiefgegangen ist
            if (webrtc && !webrtc.isPeerReady()) {
              console.log('[Chat] Peer nicht ready, registriere erneut...');
              webrtc.register();
            }
          });
        }
      }

    } catch (e) {
      console.error('Polling-Fehler:', e);
    } finally {
      POLLING = false;
    }
}


// ── MOBILE KEYBOARD DETECTION ─────────────────────────────────────────────
// Tastatur: Chat-Fenster passt sich der sichtbaren Fläche an → Eingabefeld bleibt über der Tastatur
function fitChatToViewport() {
  const el = document.getElementById('chatDetailScreen');
  if (!el || el.style.display !== 'flex') return;
  const vv = window.visualViewport;
  // Oben und unten am Layout-Fenster verankern; unten so viel Platz lassen, wie die Tastatur verdeckt
  let bottom = 0;
  if (vv) bottom = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
  el.style.top = '0px';
  el.style.height = 'auto';
  el.style.bottom = bottom + 'px';
  const m = document.getElementById('messages');
  if (m) m.scrollTop = m.scrollHeight;
}
function detectKeyboard() { fitChatToViewport(); }
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fitChatToViewport);
  window.visualViewport.addEventListener('scroll', fitChatToViewport);
}
window.addEventListener('resize', fitChatToViewport);
let KB_TIMER = null;
document.addEventListener('focusin', (e) => {
  if (e.target && e.target.id === 'msgInput') {
    fitChatToViewport();
    if (KB_TIMER) clearInterval(KB_TIMER);
    KB_TIMER = setInterval(fitChatToViewport, 250); // Fallback, falls der Browser keine Ereignisse schickt
    window.scrollTo(0, 0);
  }
});
document.addEventListener('focusout', (e) => {
  if (e.target && e.target.id === 'msgInput') {
    setTimeout(() => { if (document.activeElement && document.activeElement.id === 'msgInput') return; if (KB_TIMER) clearInterval(KB_TIMER); KB_TIMER = null; fitChatToViewport(); }, 400);
  }
});

// ── HELPERS ───────────────────────────────────────────────────────────────
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

// ── UI HELPERS ─────────────────────────────────────────────────────────────
function updateP2PUI(active, message) {
  const indicator = document.getElementById('p2pIndicator');
  const statusText = document.getElementById('p2pStatusText');
  const banner = document.getElementById('p2pBanner');
  const bannerText = document.getElementById('p2pBannerText');
  const bannerIcon = banner ? banner.querySelector('.icon') : null;

  if (!indicator) return;

  if (active) {
    indicator.className = 'p2p-indicator p2p-active';
    statusText.textContent = message || 'P2P Aktiv';
    banner.className = 'p2p-banner p2p';
    if (bannerIcon) bannerIcon.textContent = '🔒';
    bannerText.textContent = (message && message !== 'P2P Aktiv')
      ? message
      : 'Direct P2P Connection - Deine Nachrichten sind privat!';
    isP2PConnected = true;
  } else {
    indicator.className = 'p2p-indicator p2p-inactive';
    statusText.textContent = message || 'Server-Modus';
    banner.className = 'p2p-banner server';
    if (bannerIcon) bannerIcon.textContent = '☁️';
    bannerText.innerHTML = 'Server-Relay - Nachrichten werden temporär gespeichert';
    isP2PConnected = false;
  }
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/chat/sw.js')
    .then(reg => console.log('[SW] Registered:', reg))
    .catch(console.error);
}

autoLogin().catch(console.error);
